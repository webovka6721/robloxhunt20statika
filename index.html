<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Hunt Roblox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #020a2e 0%, #06399c 50%, #0553c7 100%);
            margin: 0;
            min-height: 100dvh;
        }

        .float-anim {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .sign-board {
            background: #fff;
            border: 4px solid #c2d3ec;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .sign-board::before, .sign-board::after {
            content: '';
            position: absolute;
            top: -20px;
            width: 4px;
            height: 20px;
            background: #8b5a2b;
        }
        .sign-board::before { left: 20%; }
        .sign-board::after { right: 20%; }
        
        .sign-text {
            background: linear-gradient(180deg, #1e5dd9 0%, #092c7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 1px rgba(255,255,255,0.8));
        }

        /* Floating background elements */
        .bg-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.04); 
            z-index: 0;
            pointer-events: none;
        }
        
        .float-1 { animation: float-slow 15s ease-in-out infinite; top: 15%; left: 10%; transform: scale(1.5) rotate(15deg); }
        .float-2 { animation: float-slow 22s ease-in-out infinite reverse; top: 65%; right: 10%; transform: scale(2) rotate(-20deg); }
        .float-3 { animation: float-slow 18s ease-in-out infinite; top: 30%; right: 20%; transform: scale(1) rotate(45deg); }
        .float-4 { animation: float-slow 25s ease-in-out infinite reverse; bottom: 15%; left: 15%; transform: scale(1.8) rotate(-10deg); }
        
        @keyframes float-slow {
            0% { transform: translateY(0px) rotate(0deg) scale(var(--scale)); }
            50% { transform: translateY(-20px) rotate(10deg) scale(var(--scale)); }
            100% { transform: translateY(0px) rotate(0deg) scale(var(--scale)); }
        }
    </style>
</head>
<body class="flex items-center justify-center relative overflow-hidden">

    <!-- Definitions MUST be in a visible SVG to work reliably across all browsers -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="goldFront" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE066" />
                <stop offset="50%" stop-color="#FFB300" />
                <stop offset="100%" stop-color="#F59D00" />
            </linearGradient>
            <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#D48800" />
                <stop offset="100%" stop-color="#995C00" />
            </linearGradient>
            
            <g id="robuxCoinSolid">
                <polygon points="25,5 75,5 100,50 75,95 25,95 0,50" fill="url(#goldEdge)" transform="translate(0, 8)"/>
                <polygon points="25,5 75,5 100,50 75,95 25,95 0,50" fill="url(#goldFront)"/>
                <polygon points="32,18 68,18 85,50 68,82 32,82 15,50" fill="none" stroke="#D48800" stroke-width="4"/>
                <rect x="42" y="42" width="16" height="16" fill="#7A4900" transform="rotate(15 50 50)"/>
            </g>

            <g id="robloxBgLogo">
                <rect x="2" y="2" width="20" height="20" rx="2" ry="2" fill="currentColor" transform="rotate(15 12 12)" />
                <rect x="9" y="9" width="6" height="6" fill="#020a2e" transform="rotate(15 12 12)"/>
            </g>
        </defs>
    </svg>

    <!-- Фоновые детали -->
    <svg class="bg-icon float-1 w-16 h-16" style="--scale: 1.5;" viewBox="0 0 24 24"><use href="#robloxBgLogo"/></svg>
    <svg class="bg-icon float-2 w-20 h-20" style="--scale: 2;" viewBox="0 0 24 24"><use href="#robloxBgLogo"/></svg>
    <svg class="bg-icon float-3 w-10 h-10" style="--scale: 1;" viewBox="0 0 24 24"><use href="#robloxBgLogo"/></svg>
    <svg class="bg-icon float-4 w-24 h-24" style="--scale: 1.8;" viewBox="0 0 24 24"><use href="#robloxBgLogo"/></svg>

    <!-- Главный контент -->
    <div class="w-full max-w-[400px] relative z-10 px-6 py-10 flex flex-col items-center">
        
        <!-- ВЫВЕСКА -->
        <div class="sign-board px-8 py-3 mb-6 transform -rotate-2 mt-4">
            <h2 class="text-[#092c7a] font-black text-sm uppercase tracking-widest mb-[-5px]">The</h2>
            <h1 class="sign-text font-black text-5xl tracking-tighter uppercase leading-none">Hunt</h1>
            <div class="flex items-center justify-center gap-1 mt-1">
                <h3 class="text-[#092c7a] font-black text-xl uppercase tracking-tighter">Roblox</h3>
                <span class="bg-[#d92323] text-white font-black text-lg px-2 rounded-md shadow-inner transform rotate-3">20</span>
            </div>
        </div>

        <!-- ГОРА РОБУКСОВ (Масштаб уменьшен) -->
        <svg viewBox="0 0 340 160" width="340" height="160" class="w-full max-w-[340px] drop-shadow-[0_15px_25px_rgba(0,0,0,0.6)] float-anim z-10 mb-8 overflow-visible transform scale-90">
            <defs>
                <linearGradient id="goldFront2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFE066" />
                    <stop offset="50%" stop-color="#FFB300" />
                    <stop offset="100%" stop-color="#F59D00" />
                </linearGradient>
                <linearGradient id="goldEdge2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#D48800" />
                    <stop offset="100%" stop-color="#995C00" />
                </linearGradient>
                
                <g id="robuxCoin">
                    <polygon points="25,5 75,5 100,50 75,95 25,95 0,50" fill="url(#goldEdge2)" transform="translate(0, 8)"/>
                    <polygon points="25,5 75,5 100,50 75,95 25,95 0,50" fill="url(#goldFront2)"/>
                    <polygon points="32,18 68,18 85,50 68,82 32,82 15,50" fill="none" stroke="#D48800" stroke-width="4"/>
                    <rect x="42" y="42" width="16" height="16" fill="#7A4900" transform="rotate(15 50 50)"/>
                </g>
            </defs>

            <!-- Группа уменьшена (scale: 0.8) -->
            <g transform="translate(25, 20) scale(0.8)">
                <!-- Задний ряд (Дальний) -->
                <g transform="translate(40, 0) scale(0.6) rotate(-20 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(100, -10) scale(0.65) rotate(5 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(160, -5) scale(0.6) rotate(25 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(220, 10) scale(0.55) rotate(15 50 50)"><use href="#robuxCoin"/></g>
                
                <!-- Средний ряд -->
                <g transform="translate(20, 30) scale(0.7) rotate(-10 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(80, 20) scale(0.75) rotate(-5 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(140, 15) scale(0.8) rotate(10 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(200, 25) scale(0.7) rotate(30 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(260, 40) scale(0.65) rotate(5 50 50)"><use href="#robuxCoin"/></g>

                <!-- Передний ряд -->
                <g transform="translate(0, 70) scale(0.8) rotate(-15 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(60, 60) scale(0.9) rotate(-8 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(130, 50) scale(0.95) rotate(0 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(190, 65) scale(0.85) rotate(12 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(250, 80) scale(0.75) rotate(20 50 50)"><use href="#robuxCoin"/></g>

                <!-- Центральные/Верхние -->
                <g transform="translate(90, 95) scale(1) rotate(-5 50 50)"><use href="#robuxCoin"/></g>
                <g transform="translate(160, 90) scale(1.05) rotate(5 50 50)"><use href="#robuxCoin"/></g>
            </g>
        </svg>

        <!-- Текстовый блок -->
        <h1 class="text-white font-black text-[22px] tracking-wide mb-3 leading-snug drop-shadow-md text-center">
            GET ROBUX ON<br>20TH ANNIVERSARY!
        </h1>

        <p class="text-white font-semibold text-[15px] leading-relaxed mb-6 max-w-[300px] text-center opacity-90 drop-shadow-sm">
            A promotional event<br>offering a chance for Roblox<br>users to obtain Robux!
        </p>

        <!-- Список с галочками -->
        <div class="flex flex-col items-start gap-4 mb-8 w-full max-w-[280px]">
            <div class="flex items-center gap-3 w-full">
                <svg class="w-8 h-8 text-[#6cf56c] shrink-0 drop-shadow-[0_0_8px_rgba(108,245,108,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span class="text-white font-bold text-lg drop-shadow-md tracking-wider">***** Robux remain</span>
            </div>
            <div class="flex items-center gap-3 w-full">
                <svg class="w-8 h-8 text-[#6cf56c] shrink-0 drop-shadow-[0_0_8px_rgba(108,245,108,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span class="text-white font-bold text-lg drop-shadow-md">Everyone is eligible!</span>
            </div>
        </div>

        <!-- Кнопка CLAIM NOW! -->
        <button id="claim-btn" class="w-full max-w-[320px] bg-[#6cf56c] hover:bg-[#5ce05c] text-black font-black text-[22px] py-4 rounded-[28px] shadow-[0_4px_25px_rgba(108,245,108,0.4)] active:scale-95 transition-all overflow-hidden group">
            <span class="relative z-10">CLAIM NOW!</span>
        </button>
        
    </div>

    <script>
        document.getElementById('claim-btn').addEventListener('click', function() {
            if(this.disabled) return;
            this.disabled = true;

            this.innerHTML = '<span class="relative z-10">LOADING...</span>';
            this.classList.remove('bg-[#6cf56c]', 'hover:bg-[#5ce05c]');
            this.classList.add('bg-white', 'text-blue-900');
            
            var duration = 2000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.2, y: 0.6 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: 0.8, y: 0.6 } }));
            }, 250);

            setTimeout(() => {
                this.innerHTML = '<span class="relative z-10">SUCCESS!</span>';
                this.classList.add('bg-[#6cf56c]', 'hover:bg-[#5ce05c]');
                this.classList.remove('bg-white', 'text-blue-900');
            }, 2000);
        });
    </script>
</body>
</html>
